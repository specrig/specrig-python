[project]
name = "shop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.8",
    "sqlalchemy>=2.0",
]

[project.scripts]
shop = "shop.cli:main"

[dependency-groups]
dev = ["specrig[fastapi,postgres]"]
